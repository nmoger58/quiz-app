<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ಕನ್ನಡ ಕ್ವಿಜ್ ಅರೆನಾ - KANNADA QUIZ ARENA (Projector Display)</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22%20%220%22%20%22100%22%20%22100%22><text y=%22.9em%22 font-size=%2290%22>📽️</text></svg>">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Animate.css -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/animate.css@4.1.1/animate.min.css">

  <!-- Custom App Styles -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="projector-body">

  <div id="projectorApp">
    <!-- Initial Loading State -->
    <div class="d-flex justify-content-center align-items-center min-vh-100">
      <div class="text-center">
        <div class="spinner-grow text-warning mb-3" style="width: 4rem; height: 4rem;" role="status"></div>
        <h2 class="font-kannada text-warning fw-bold">ಪ್ರೊಜೆಕ್ಟರ್ ಪರದೆ ಸಂಪರ್ಕಗೊಳ್ಳುತ್ತಿದೆ...</h2>
        <p class="text-secondary">ಶಿಕ್ಷಕರ ಪರದೆಯೊಂದಿಗೆ ಸಂಯೋಜನೆ ಪ್ರಕ್ರಿಯೆಯಲ್ಲಿದೆ...</p>
      </div>
    </div>
  </div>

  <!-- Third-party Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

  <!-- Application Logic Modules -->
  <script src="js/questions.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/transport.js"></script>
  <script src="js/scoringSystem.js"></script>
  <script src="js/leaderboard.js"></script>
  <script src="js/projectorUI.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      let sessionId = urlParams.get('session') || StorageManager.getActiveSessionId() || 'KA-DEMO';

      const transport = new QuizTransport();
      transport.connect(sessionId, 'projector');

      const projectorUI = new ProjectorUI(transport);
      window.projectorAppInstance = projectorUI;
      projectorUI.init();

      // Check if there is already a saved public snapshot in storage
      const savedSession = StorageManager.loadSession(sessionId);
      if (savedSession) {
        // Build public projection to avoid revealing answer prematurely
        projectorUI.handleIncomingEvent({
          type: 'STATE_SNAPSHOT',
          revision: savedSession.revision || 1,
          state: {
            ...savedSession,
            question: {
              ...savedSession.question,
              correctAnswer: savedSession.display && savedSession.display.revealAnswer ? savedSession.question.correctAnswer : null,
              explanation: savedSession.display && savedSession.display.revealAnswer ? savedSession.question.explanation : null
            }
          }
        });
      }
    });
  </script>

</body>
</html>
