<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#31102f"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgGrad)"/>
  
  <!-- Aura circle -->
  <circle cx="300" cy="180" r="130" fill="#431407" opacity="0.6"/>
  <circle cx="300" cy="180" r="110" fill="#78350f" opacity="0.4"/>
  
  <!-- Silhouette of Rashtrakavi Kuvempu with spectacles and traditional attire -->
  <path d="M 230 340 C 230 260 260 250 260 230 C 250 220 240 200 240 170 C 240 130 265 100 300 100 C 335 100 360 130 360 170 C 360 200 350 220 340 230 C 340 250 370 260 370 340 Z" fill="#f8fafc"/>
  
  <!-- Hair & details -->
  <path d="M 255 130 C 265 105 300 100 345 130 C 360 150 360 170 355 180 C 350 150 330 115 295 115 C 265 115 255 145 255 170 Z" fill="#cbd5e1"/>
  
  <!-- Glasses / Spectacles -->
  <rect x="265" y="155" width="28" height="20" rx="4" fill="none" stroke="#0f172a" stroke-width="4"/>
  <rect x="307" y="155" width="28" height="20" rx="4" fill="none" stroke="#0f172a" stroke-width="4"/>
  <line x1="293" y1="165" x2="307" y2="165" stroke="#0f172a" stroke-width="4"/>
  <line x1="255" y1="163" x2="265" y2="163" stroke="#0f172a" stroke-width="3"/>
  <line x1="335" y1="163" x2="345" y2="163" stroke="#0f172a" stroke-width="3"/>

  <!-- Shawl / Shalu (Red & Gold border) -->
  <path d="M 230 340 L 265 240 L 290 280 L 310 280 L 335 240 L 370 340 Z" fill="#e11d48"/>
  <path d="M 255 260 L 275 340 L 290 340 L 270 260 Z" fill="#fbbf24"/>
  <path d="M 345 260 L 325 340 L 310 340 L 330 260 Z" fill="#fbbf24"/>

  <!-- Quill and Book icon -->
  <path d="M 100 320 C 130 300 160 300 180 320 L 175 335 C 155 315 130 315 100 330 Z" fill="#fbbf24"/>
  <polygon points="175,260 185,265 145,320 135,315" fill="#f8fafc"/>

  <text x="300" y="380" font-family="'Noto Sans Kannada', sans-serif" font-size="22" font-weight="bold" fill="#fef08a" text-anchor="middle">ರಾಷ್ಟ್ರಕವಿ - ಕುವೆಂಪು (Kuvempu)</text>
</svg>
