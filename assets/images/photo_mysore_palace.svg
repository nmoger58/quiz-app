<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="illumination" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#nightSky)"/>
  <circle cx="300" cy="220" r="220" fill="url(#illumination)"/>

  <!-- Palace Main Silhouette & Illumination -->
  <!-- Ground -->
  <rect x="0" y="310" width="600" height="90" fill="#0b0f19"/>
  <line x1="0" y1="310" x2="600" y2="310" stroke="#f59e0b" stroke-width="3"/>

  <!-- Wings of Palace -->
  <rect x="60" y="220" width="480" height="90" fill="#78350f" stroke="#fbbf24" stroke-width="2"/>
  
  <!-- Arches illuminated -->
  <g fill="#fef08a">
    <path d="M 80 305 L 80 250 A 15 15 0 0 1 110 250 L 110 305 Z"/>
    <path d="M 120 305 L 120 250 A 15 15 0 0 1 150 250 L 150 305 Z"/>
    <path d="M 160 305 L 160 250 A 15 15 0 0 1 190 250 L 190 305 Z"/>
    <path d="M 200 305 L 200 250 A 15 15 0 0 1 230 250 L 230 305 Z"/>
    <!-- Central Grand Arch -->
    <path d="M 260 305 L 260 220 A 40 40 0 0 1 340 220 L 340 305 Z" fill="#fffbeb"/>
    <path d="M 370 305 L 370 250 A 15 15 0 0 1 400 250 L 400 305 Z"/>
    <path d="M 410 305 L 410 250 A 15 15 0 0 1 440 250 L 440 305 Z"/>
    <path d="M 450 305 L 450 250 A 15 15 0 0 1 480 250 L 480 305 Z"/>
    <path d="M 490 305 L 490 250 A 15 15 0 0 1 520 250 L 520 305 Z"/>
  </g>

  <!-- Central Tower / Gombe Mane -->
  <rect x="250" y="140" width="100" height="80" fill="#92400e" stroke="#fbbf24" stroke-width="2"/>
  <polygon points="230,140 370,140 300,70" fill="#dc2626" stroke="#fbbf24" stroke-width="2"/>
  <circle cx="300" cy="65" r="8" fill="#fbbf24"/>

  <!-- Corner Domes (Pink/Red Gold domes) -->
  <rect x="50" y="190" width="35" height="30" fill="#92400e"/>
  <path d="M 45 190 C 45 155 90 155 90 190 Z" fill="#e11d48" stroke="#fbbf24" stroke-width="2"/>
  <circle cx="67" cy="150" r="5" fill="#fbbf24"/>

  <rect x="515" y="190" width="35" height="30" fill="#92400e"/>
  <path d="M 510 190 C 510 155 555 155 555 190 Z" fill="#e11d48" stroke="#fbbf24" stroke-width="2"/>
  <circle cx="532" cy="150" r="5" fill="#fbbf24"/>

  <!-- Thousands of light bulbs effect -->
  <g fill="#fffbeb" opacity="0.9">
    <circle cx="60" cy="220" r="2"/><circle cx="100" cy="220" r="2"/><circle cx="140" cy="220" r="2"/>
    <circle cx="180" cy="220" r="2"/><circle cx="220" cy="220" r="2"/><circle cx="260" cy="220" r="2"/>
    <circle cx="340" cy="220" r="2"/><circle cx="380" cy="220" r="2"/><circle cx="420" cy="220" r="2"/>
    <circle cx="460" cy="220" r="2"/><circle cx="500" cy="220" r="2"/><circle cx="540" cy="220" r="2"/>
    <circle cx="250" cy="140" r="2"/><circle cx="350" cy="140" r="2"/><circle cx="300" cy="100" r="2"/>
  </g>

  <text x="300" y="375" font-family="'Noto Sans Kannada', sans-serif" font-size="22" font-weight="bold" fill="#fef08a" text-anchor="middle">ಮೈಸೂರು ಅರಮನೆ (Mysore Palace)</text>
</svg>
