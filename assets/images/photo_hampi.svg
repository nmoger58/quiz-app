<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#431407"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="stoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="400" fill="url(#skyGrad)"/>
  <circle cx="300" cy="180" r="140" fill="url(#sun)"/>
  <!-- Ground -->
  <rect x="0" y="320" width="600" height="80" fill="#451a03"/>
  <rect x="0" y="315" width="600" height="8" fill="#78350f"/>
  
  <!-- Chariot Platform -->
  <rect x="150" y="270" width="300" height="45" rx="5" fill="url(#stoneGrad)"/>
  <rect x="170" y="250" width="260" height="25" fill="#b45309"/>
  
  <!-- Chariot Pillars and Body -->
  <rect x="190" y="160" width="220" height="90" fill="url(#stoneGrad)" stroke="#78350f" stroke-width="2"/>
  <rect x="210" y="165" width="20" height="80" fill="#78350f"/>
  <rect x="250" y="165" width="20" height="80" fill="#78350f"/>
  <rect x="330" y="165" width="20" height="80" fill="#78350f"/>
  <rect x="370" y="165" width="20" height="80" fill="#78350f"/>
  <rect x="280" y="180" width="40" height="65" rx="4" fill="#451a03"/>

  <!-- Gopuram / Vimana top -->
  <polygon points="170,160 430,160 380,120 220,120" fill="#b45309"/>
  <polygon points="200,120 400,120 360,80 240,80" fill="url(#stoneGrad)"/>
  <polygon points="230,80 370,80 330,50 270,50" fill="#b45309"/>
  <circle cx="300" cy="40" r="14" fill="#fef08a"/>

  <!-- Chariot Stone Wheels -->
  <!-- Wheel 1 (Left) -->
  <circle cx="210" cy="295" r="38" fill="url(#stoneGrad)" stroke="#78350f" stroke-width="4"/>
  <circle cx="210" cy="295" r="14" fill="#451a03"/>
  <circle cx="210" cy="295" r="6" fill="#fef08a"/>
  <!-- Wheel 2 (Right) -->
  <circle cx="390" cy="295" r="38" fill="url(#stoneGrad)" stroke="#78350f" stroke-width="4"/>
  <circle cx="390" cy="295" r="14" fill="#451a03"/>
  <circle cx="390" cy="295" r="6" fill="#fef08a"/>

  <!-- Elephant Statues facing front -->
  <path d="M 120 290 Q 140 270 160 280 L 160 320 L 125 320 Z" fill="#92400e"/>
  <path d="M 480 290 Q 460 270 440 280 L 440 320 L 475 320 Z" fill="#92400e"/>

  <text x="300" y="380" font-family="'Noto Sans Kannada', sans-serif" font-size="22" font-weight="bold" fill="#fef08a" text-anchor="middle">ಕಲ್ಲಿನ ರಥ (Stone Chariot) - ಹಂಪಿ</text>
</svg>
