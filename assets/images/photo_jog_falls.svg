<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="gorgeBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="50%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="waterRaja" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="80%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <radialGradient id="mist" cx="50%" cy="100%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#gorgeBg)"/>

  <!-- Western Ghats Mountain Cliff Face -->
  <polygon points="0,50 180,50 140,400 0,400" fill="#292524"/>
  <polygon points="180,50 290,50 270,400 140,400" fill="#1c1917"/>
  <polygon points="340,50 480,50 460,400 320,400" fill="#292524"/>
  <polygon points="480,50 600,50 600,400 460,400" fill="#1c1917"/>

  <!-- Lush green foliage on cliffs -->
  <circle cx="90" cy="50" r="30" fill="#15803d"/>
  <circle cx="150" cy="50" r="25" fill="#166534"/>
  <circle cx="360" cy="50" r="30" fill="#15803d"/>
  <circle cx="530" cy="50" r="35" fill="#166534"/>

  <!-- Four Cascades of Jog: Raja, Roarer, Rocket, Rani -->
  
  <!-- 1. RAJA (Grand uninterrupted fall) -->
  <path d="M 175 50 Q 185 200 170 330 L 195 330 Q 195 200 185 50 Z" fill="url(#waterRaja)"/>
  
  <!-- 2. ROARER (Gushing into rocks) -->
  <path d="M 235 50 Q 220 180 250 220 L 265 330 L 250 330 Q 235 220 245 50 Z" fill="url(#waterRaja)"/>

  <!-- 3. ROCKET (Shoots jets of water) -->
  <path d="M 335 50 Q 345 150 330 240 L 345 330 L 355 330 Q 360 200 345 50 Z" fill="url(#waterRaja)"/>

  <!-- 4. RANI (Meandering graceful sheet) -->
  <path d="M 450 50 Q 430 180 470 260 L 490 330 L 475 330 Q 445 220 465 50 Z" fill="url(#waterRaja)"/>

  <!-- Dense spray / mist at bottom pool -->
  <rect x="0" y="320" width="600" height="80" fill="url(#mist)"/>
  <ellipse cx="300" cy="350" rx="250" ry="40" fill="#e0f2fe" opacity="0.6"/>

  <!-- Rainbow in mist -->
  <path d="M 200 360 A 100 60 0 0 1 400 360" stroke="#f43f5e" stroke-width="3" fill="none" opacity="0.5"/>
  <path d="M 205 362 A 95 55 0 0 1 395 362" stroke="#f59e0b" stroke-width="3" fill="none" opacity="0.5"/>
  <path d="M 210 364 A 90 50 0 0 1 390 364" stroke="#10b981" stroke-width="3" fill="none" opacity="0.5"/>
  <path d="M 215 366 A 85 45 0 0 1 385 366" stroke="#3b82f6" stroke-width="3" fill="none" opacity="0.5"/>

  <text x="300" y="385" font-family="'Noto Sans Kannada', sans-serif" font-size="22" font-weight="bold" fill="#0f172a" text-anchor="middle">ಜೋಗ ಜಲಪಾತ - ರಾಜ, ರಾಣಿ, ರೋರರ್, ರಾಕೆಟ್</text>
</svg>
