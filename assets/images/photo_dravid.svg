<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="cricketBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082f49"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#cricketBg)"/>
  
  <!-- Cricket Stadium Floodlights glow -->
  <circle cx="150" cy="80" r="60" fill="#bae6fd" opacity="0.3"/>
  <circle cx="450" cy="80" r="60" fill="#bae6fd" opacity="0.3"/>
  
  <!-- Silhouette of Cricket Batsman / Legend -->
  <!-- Pitch -->
  <rect x="0" y="310" width="600" height="90" fill="#15803d"/>
  <rect x="150" y="310" width="300" height="40" fill="#ca8a04"/>
  <line x1="200" y1="310" x2="200" y2="350" stroke="#f8fafc" stroke-width="4"/>

  <!-- Rahul Dravid in India Blue Jersey / Helmet / Batting Stance -->
  <!-- Legs with white pads -->
  <rect x="250" y="240" width="22" height="70" rx="6" fill="#f8fafc" stroke="#0284c7" stroke-width="2"/>
  <rect x="280" y="240" width="22" height="70" rx="6" fill="#f8fafc" stroke="#0284c7" stroke-width="2"/>
  
  <!-- Torso (Team India Blue #0284c7) -->
  <path d="M 240 240 L 250 170 L 305 170 L 315 240 Z" fill="#0369a1"/>
  <!-- Collar & Tricolor accent -->
  <polygon points="265,170 290,170 278,190" fill="#f59e0b"/>
  
  <!-- Head & Helmet (Dark Blue with grille) -->
  <circle cx="278" cy="140" r="24" fill="#0c4a6e"/>
  <!-- Helmet visor & grille -->
  <path d="M 278 135 L 305 142 L 285 155 Z" fill="#38bdf8"/>
  <line x1="280" y1="145" x2="300" y2="148" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="280" y1="150" x2="295" y2="152" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Arms & Gloves holding bat -->
  <path d="M 250 180 L 235 220 L 255 225 Z" fill="#0369a1"/>
  <circle cx="240" cy="225" r="12" fill="#f8fafc" stroke="#dc2626" stroke-width="2"/>
  
  <!-- Cricket Bat (The Wall) -->
  <rect x="232" y="225" width="16" height="85" rx="3" transform="rotate(-15 240 260)" fill="#fde047" stroke="#78350f" stroke-width="2"/>
  <rect x="237" y="195" width="8" height="30" rx="2" transform="rotate(-15 240 260)" fill="#f8fafc"/>

  <!-- Stumps behind -->
  <line x1="180" y1="240" x2="180" y2="310" stroke="#fef08a" stroke-width="4"/>
  <line x1="190" y1="240" x2="190" y2="310" stroke="#fef08a" stroke-width="4"/>
  <line x1="200" y1="240" x2="200" y2="310" stroke="#fef08a" stroke-width="4"/>
  <line x1="176" y1="240" x2="204" y2="240" stroke="#fef08a" stroke-width="4"/>

  <!-- "THE WALL" Badge -->
  <rect x="360" y="140" width="190" height="50" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
  <text x="455" y="165" font-family="'Noto Sans Kannada', sans-serif" font-size="16" font-weight="bold" fill="#fef08a" text-anchor="middle">ಕನ್ನಡಿಗ - 'ದಿ ವಾಲ್'</text>
  <text x="455" y="182" font-family="sans-serif" font-size="12" fill="#38bdf8" text-anchor="middle">THE WALL OF INDIA</text>

  <text x="300" y="380" font-family="'Noto Sans Kannada', sans-serif" font-size="22" font-weight="bold" fill="#fef08a" text-anchor="middle">ರಾಹುಲ್ ದ್ರಾವಿಡ್ (Rahul Dravid)</text>
</svg>
