<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="anrBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a044e"/>
      <stop offset="50%" stop-color="#831843"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#anrBg)"/>
  <circle cx="300" cy="170" r="130" fill="url(#halo)"/>

  <!-- Silhouette & Portrait Features of Dr. Rajkumar (White Jubba, vibhooti/kumkuma) -->
  <path d="M 210 350 C 210 270 250 250 250 230 C 240 220 230 190 230 160 C 230 110 260 80 300 80 C 340 80 370 110 370 160 C 370 190 360 220 350 230 C 350 250 390 270 390 350 Z" fill="#fffbeb"/>
  
  <!-- Classic Rajkumar Hair Style -->
  <path d="M 235 140 C 245 90 280 75 320 80 C 355 85 368 110 368 140 C 360 115 340 95 305 95 C 270 95 245 115 235 140 Z" fill="#1e293b"/>
  
  <!-- Iconic Smiling Eyes & Eyebrows -->
  <path d="M 265 145 Q 280 138 290 145" stroke="#0f172a" stroke-width="4" fill="none"/>
  <path d="M 310 145 Q 320 138 335 145" stroke="#0f172a" stroke-width="4" fill="none"/>
  <circle cx="278" cy="155" r="4" fill="#0f172a"/>
  <circle cx="322" cy="155" r="4" fill="#0f172a"/>
  
  <!-- Vibhooti and Vermilion Tilak (ಬಸವಣ್ಣ / ಶಿವನ ಭಕ್ತ ತಿಲಕ) -->
  <line x1="285" y1="120" x2="315" y2="120" stroke="#cbd5e1" stroke-width="3"/>
  <line x1="288" y1="125" x2="312" y2="125" stroke="#cbd5e1" stroke-width="3"/>
  <circle cx="300" cy="122" r="3.5" fill="#dc2626"/>

  <!-- Warm, charismatic smile -->
  <path d="M 275 190 Q 300 210 325 190" stroke="#0f172a" stroke-width="3.5" fill="none"/>

  <!-- Mysore Peta / Traditional Mysore Silk Shawl on shoulder -->
  <path d="M 210 350 L 250 250 L 280 350 Z" fill="#e11d48"/>
  <path d="M 250 250 L 260 350 L 270 350 L 255 250 Z" fill="#fbbf24"/>

  <!-- Film Roll Ribbon decoration -->
  <path d="M 80 180 Q 130 150 160 210 Q 190 270 170 320" stroke="#f59e0b" stroke-width="6" fill="none" stroke-dasharray="10 5"/>
  <path d="M 520 180 Q 470 150 440 210 Q 410 270 430 320" stroke="#f59e0b" stroke-width="6" fill="none" stroke-dasharray="10 5"/>

  <!-- Banner -->
  <rect x="170" y="325" width="260" height="30" rx="6" fill="#78350f" stroke="#fef08a" stroke-width="2"/>
  <text x="300" y="346" font-family="'Noto Sans Kannada', sans-serif" font-size="16" font-weight="bold" fill="#fef08a" text-anchor="middle">ನಟಸಾರ್ವಭೌಮ - ಕರ್ನಾಟಕ ರತ್ನ</text>

  <text x="300" y="385" font-family="'Noto Sans Kannada', sans-serif" font-size="22" font-weight="bold" fill="#fef08a" text-anchor="middle">ಡಾ. ರಾಜ್‌ಕುಮಾರ್ (Dr. Rajkumar)</text>
</svg>
