<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="ggBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#4c0519"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="domeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#ggBg)"/>
  
  <!-- Ground -->
  <rect x="0" y="320" width="600" height="80" fill="#292524"/>
  <rect x="0" y="315" width="600" height="6" fill="#78350f"/>

  <!-- Gol Gumbaz Main Cube Structure -->
  <rect x="160" y="160" width="280" height="155" fill="#a8a29e" stroke="#57534e" stroke-width="3"/>

  <!-- Four Corner Octagonal 7-storey Minarets -->
  <!-- Left Minaret -->
  <rect x="135" y="100" width="35" height="215" fill="#78716c" stroke="#44403c" stroke-width="2"/>
  <polygon points="125,100 180,100 152,70" fill="url(#domeGrad)"/>
  <circle cx="152" cy="65" r="5" fill="#fef08a"/>
  <!-- Minaret Storey Dividers -->
  <line x1="130" y1="130" x2="175" y2="130" stroke="#fef08a" stroke-width="2"/>
  <line x1="130" y1="160" x2="175" y2="160" stroke="#fef08a" stroke-width="2"/>
  <line x1="130" y1="190" x2="175" y2="190" stroke="#fef08a" stroke-width="2"/>
  <line x1="130" y1="220" x2="175" y2="220" stroke="#fef08a" stroke-width="2"/>
  <line x1="130" y1="250" x2="175" y2="250" stroke="#fef08a" stroke-width="2"/>
  <line x1="130" y1="280" x2="175" y2="280" stroke="#fef08a" stroke-width="2"/>

  <!-- Right Minaret -->
  <rect x="430" y="100" width="35" height="215" fill="#78716c" stroke="#44403c" stroke-width="2"/>
  <polygon points="420,100 475,100 447,70" fill="url(#domeGrad)"/>
  <circle cx="447" cy="65" r="5" fill="#fef08a"/>
  <!-- Minaret Storey Dividers -->
  <line x1="425" y1="130" x2="470" y2="130" stroke="#fef08a" stroke-width="2"/>
  <line x1="425" y1="160" x2="470" y2="160" stroke="#fef08a" stroke-width="2"/>
  <line x1="425" y1="190" x2="470" y2="190" stroke="#fef08a" stroke-width="2"/>
  <line x1="425" y1="220" x2="470" y2="220" stroke="#fef08a" stroke-width="2"/>
  <line x1="425" y1="250" x2="470" y2="250" stroke="#fef08a" stroke-width="2"/>
  <line x1="425" y1="280" x2="470" y2="280" stroke="#fef08a" stroke-width="2"/>

  <!-- Giant Semi-Circular Dome (World's 2nd largest unsupported dome) -->
  <path d="M 180 160 C 180 60 420 60 420 160 Z" fill="url(#domeGrad)" stroke="#44403c" stroke-width="3"/>
  <!-- Dome Finial / Kalasa -->
  <polygon points="295,60 305,60 300,35" fill="#fef08a"/>
  <circle cx="300" cy="30" r="6" fill="#fef08a"/>

  <!-- Petals at dome base -->
  <path d="M 180 160 Q 200 150 220 160 Q 240 150 260 160 Q 280 150 300 160 Q 320 150 340 160 Q 360 150 380 160 Q 400 150 420 160" fill="none" stroke="#78350f" stroke-width="4"/>

  <!-- Arches on facade -->
  <path d="M 265 315 L 265 240 A 35 35 0 0 1 335 240 L 335 315 Z" fill="#292524" stroke="#d97706" stroke-width="2"/>
  <path d="M 190 290 L 190 230 A 20 20 0 0 1 230 230 L 230 290 Z" fill="#44403c"/>
  <path d="M 370 290 L 370 230 A 20 20 0 0 1 410 230 L 410 290 Z" fill="#44403c"/>

  <!-- Whispering Gallery Badge -->
  <text x="300" y="380" font-family="'Noto Sans Kannada', sans-serif" font-size="22" font-weight="bold" fill="#fef08a" text-anchor="middle">ಗೋಲ್ ಗುಂಬಜ್ - ವಿಜಯಪುರ</text>
</svg>
